    <!-- Core Focus Chips -->
    <rect x="24" y="134" width="212" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="36" y="152" fill="#CBD5E1" font-size="11.5" class="sans">⚡ Enterprise Architecture</text>

    <rect x="246" y="134" width="216" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="258" y="152" fill="#CBD5E1" font-size="11.5" class="sans">☁️ Distributed &amp; Cloud Systems</text>

    <rect x="24" y="170" width="212" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="36" y="188" fill="#CBD5E1" font-size="11.5" class="sans">🛡️ Software Quality &amp; Testing</text>

    <rect x="246" y="170" width="216" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="258" y="188" fill="#CBD5E1" font-size="11.5" class="sans">🚀 Agile &amp; DevOps Engineering</text>

    <!-- Progress Bar -->
    <text x="24" y="220" fill="#94A3B8" font-size="10.5" font-weight="600" class="mono">ACADEMIC STATUS: IN PROGRESS</text>
    <rect x="24" y="228" width="438" height="6" rx="3" fill="#1E293B"/>
    <rect x="24" y="228" width="310" height="6" rx="3" fill="url(#leftTop)"/>

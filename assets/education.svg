  </style>

  <!-- ==================== LEFT CARD: BSc (Hons) ==================== -->
  <g>
    <rect x="1" y="1" width="486" height="248" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="1" y="1" width="486" height="5" rx="3" fill="url(#leftTop)"/>

    <!-- Badges -->
    <rect x="24" y="24" width="134" height="22" rx="6" fill="#4C1D95" fill-opacity="0.55" stroke="#7C3AED" stroke-opacity="0.6"/>
    <text x="91" y="39" text-anchor="middle" fill="#C4B5FD" font-size="10" font-weight="700" letter-spacing="0.8" class="mono">HONOURS DEGREE</text>

    <rect x="168" y="24" width="142" height="22" rx="6" fill="#164E63" fill-opacity="0.55" stroke="#06B6D4" stroke-opacity="0.6"/>
    <text x="239" y="39" text-anchor="middle" fill="#67E8F9" font-size="10" font-weight="700" letter-spacing="0.8" class="mono">CURRENTLY READING</text>

    <!-- Title & University -->
    <text x="24" y="80" fill="#F8FAFC" font-size="19" font-weight="800" class="sans">BSc (Hons) in Software Engineering</text>
    <text x="24" y="103" fill="#38BDF8" font-size="13" font-weight="600" class="sans">Cardiff Metropolitan University</text>

    <!-- Divider -->

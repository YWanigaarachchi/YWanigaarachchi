    <text x="91" y="39" text-anchor="middle" fill="#E2E8F0" font-size="10" font-weight="700" letter-spacing="0.8" class="mono">HIGHER DIPLOMA</text>

    <rect x="168" y="24" width="128" height="22" rx="6" fill="#064E3B" fill-opacity="0.65" stroke="#10B981" stroke-opacity="0.8"/>
    <text x="232" y="39" text-anchor="middle" fill="#6EE7B7" font-size="10" font-weight="700" letter-spacing="0.8" class="mono">★ MERIT PASS</text>

    <!-- Title & University -->
    <text x="24" y="80" fill="#F8FAFC" font-size="18.5" font-weight="800" class="sans">Higher Diploma in CS &amp; Software Eng.</text>
    <text x="24" y="103" fill="#34D399" font-size="13" font-weight="600" class="sans">Cardiff Metropolitan University</text>

    <!-- Divider -->
    <line x1="24" y1="120" x2="462" y2="120" stroke="#1E293B" stroke-width="1"/>

    <!-- Core Focus Chips -->
    <rect x="24" y="134" width="212" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="36" y="152" fill="#CBD5E1" font-size="11.5" class="sans">🧩 Object-Oriented Engineering</text>

    <rect x="246" y="134" width="216" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="258" y="152" fill="#CBD5E1" font-size="11.5" class="sans">📐 Data Structures &amp; Algorithms</text>

    <rect x="24" y="170" width="212" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="36" y="188" fill="#CBD5E1" font-size="11.5" class="sans">🗄️ Database &amp; SQL Optimization</text>

    <rect x="246" y="170" width="216" height="28" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="258" y="188" fill="#CBD5E1" font-size="11.5" class="sans">🌐 Full-Stack Web &amp; APIs</text>

    <!-- Completion Bar -->
    <text x="24" y="220" fill="#34D399" font-size="10.5" font-weight="600" class="mono">COMPLETED · AWARDED WITH MERIT PASS ✓</text>
    <rect x="24" y="228" width="438" height="6" rx="3" fill="url(#rightTop)"/>
